spring:
  application:
    name: pequenos-sanos

  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:pequenos_sanos_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 5002
  compression:
    enabled: true
    min-response-size: 2048
    mime-types: application/json,application/xml,text/xml,text/plain

api:
  security:
    token:
      secret: ${JWT_SECRET}
      expiration: 7200000

# ─── Actuator ─────────────────────────────────────────────────────────────────
management:
  info:
    env:
      enabled: true
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
      cors:
        allowed-origins: ${URL_CORS_PERMISSION:*}
        allowed-methods: "GET,OPTIONS"

# ─── CORS ─────────────────────────────────────────────────────────────────────
cors-settings:
  url: ${URL_CORS_PERMISSION:*}

# ─── Project info (populated by Maven filtering) ──────────────────────────────
info:
  application:
    groupId: '@project.groupId@'
    artifactId: '@project.artifactId@'
    version: '@project.version@'
