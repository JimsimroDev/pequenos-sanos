services:
  db:
    image: postgres:15-alpine
    container_name: pequenos-sanos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pequenos_sanos_db}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-pequenos_sanos_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: pequenos-sanos-app
    restart: unless-stopped
    ports:
      - "5002:5002"
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
